<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crime Board — Investigation Network Graph</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="header-text">
      <h1 id="page-title" data-i18n="pageTitle">Quadro de Crimes</h1>
      <p id="page-subtitle" data-i18n="pageSubtitle">Rede de Investigação Criminal</p>
    </div>
    <div class="lang-control">
      <label for="lang-select" data-i18n="langLabel">Idioma</label>
      <select id="lang-select">
        <option value="pt-BR">Português (Brasil)</option>
        <option value="en-US">English (US)</option>
      </select>
    </div>
  </header>

  <main class="app-main">
    <aside class="input-panel">
      <label class="field-label" for="relation-input" data-i18n="textareaLabel">Texto das relações</label>
      <textarea id="relation-input" spellcheck="false" data-i18n-placeholder="textareaPlaceholder">[Flávio Bolsonaro] -> [Fabrício Queiroz] : Rachadinha (Desvio de salários) | Fontes: https://noticia1.com/rachadinha, https://noticia2.com/relatorio-coaf
[Flávio Bolsonaro] -> [Fabrício Queiroz] : Lavagem de Dinheiro (Loja de Chocolates) | Fontes: https://noticia3.com/chocolates
[Fabrício Queiroz] -> [Milícia de Rio das Pedras] : Ligação com milicianos | Fontes: https://noticia4.com/milicia
[Victor (O Chefe)] -> [Marcos (O Capanga)] : Emprega e dá ordens para | Fontes: https://inquerito.gov/pag12
[Victor (O Chefe)] -> [Sr. Silva (Contador)] : Usa para lavar dinheiro | Fontes: 
[Inspetor Carlos] -> [Victor (O Chefe)] : Recebe propina de | Fontes: https://audio-vazado.com/carlos
[Ana (Testemunha)] -> [Jornalista Investigativo] : Forneceu provas em segredo | Fontes: 
[Jornalista Investigativo] -> [Importadora Global] : Publicou dossiê sobre | Fontes: https://jornal.com/dossie-global
[Importadora Global] -> [Sr. Silva (Contador)] : Fachada gerenciada por | Fontes: </textarea>
      <button id="parse-button" type="button" data-i18n="parseButton">Processar</button>
    </aside>
    <section class="network-panel">
      <div id="network"></div>
    </section>
  </main>

  <div id="edge-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title">Conexão</h2>
        <button id="modal-close" class="modal-close" type="button" data-i18n="modalClose">Fechar</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
</body>
</html>
