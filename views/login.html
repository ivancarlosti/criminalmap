<main class="app-main app-main-centered">
  <div class="card auth-card">
    <h2 class="card-title" data-i18n="authHeading">Admin login</h2>

    {{#if AUTH_NOT_CONFIGURED}}
      <div class="banner banner-warning" data-i18n="authNotConfigured">Authentication is not configured. Set ADMIN_LOGIN and ADMIN_PASSWORD.</div>
    {{/if}}

    {{#if ERROR_MESSAGE}}
      <div class="banner banner-error" data-i18n="{{ERROR_MESSAGE}}"></div>
    {{/if}}

    <form method="post" action="/auth/login" class="stacked-form">
      <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
      <input type="hidden" name="next" value="{{NEXT_URL}}">

      <label class="field-label" for="login-email" data-i18n="authEmail">Email</label>
      <input id="login-email" type="email" name="email" value="{{EMAIL}}" autocomplete="email" required autofocus>

      <label class="field-label" for="login-password" data-i18n="authPassword">Password</label>
      <input id="login-password" type="password" name="password" autocomplete="current-password" required>

      <button type="submit" data-i18n="authSignIn">Sign in</button>
    </form>
  </div>
</main>
